<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Event Project</title>

</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button id="addBtn">
                Add
            </button>

        </div>

        <div id="taskContainer">

            <div class="task">

                <span class="task-text">
                    Learn JavaScript
                </span>

                <button class="delete-btn">
                    Delete
                </button>

            </div>

            <div class="task">

                <span class="task-text">
                    Practice DOM
                </span>

                <button class="delete-btn">
                    Delete
                </button>

            </div>

            <div class="task">

                <span class="task-text">
                    Practice DOM
                </span>

                <button class="delete-btn">
                    Delete
                </button>

            </div>

        </div>

        <div id="eventLog">
            Click on a task...
        </div>

    </div>


</body>

<script src="js/app.js"></script>

</html>
