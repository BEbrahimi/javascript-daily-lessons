<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        body{
            text-align: center;
        }
        #container{
            width: 600px;
            height: 250px;
            border: 3px solid black;
            position: relative;
            overflow: hidden;
        }
        #box{
            width: 70px;
            height: 70px;
            background-color: orange;
            position: absolute;
            left: 0;
            border-radius: 100%;
            top:90px;
        }

        button{
            padding: 10px 25px;
            margin: 5px;
            cursor: pointer;
        }
    </style>

</head>

<body>
    
    <div id="container">
        <div id="box"></div>
    </div>

    <button onclick="startAnimation()">Start</button>
    <button onclick="stopAnimation()">Stop</button>

    
</body>

<script>
    const box = document.getElementById("box");
    let position = 0;
    let animation;

    function startAnimation(){
        clearInterval(animation);

        animation = setInterval(()=>{
            position+=5;
            box.style.left = position +"px";

            if(position >=530){
            clearInterval(animation);
             }
        },30)
        
    }

    function stopAnimation(){
        clearInterval(animation);
    }




</script>





</html>
