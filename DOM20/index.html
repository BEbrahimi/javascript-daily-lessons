<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">

        <h1>Create Account</h1>
        <p class="subtitle">Join our learning platform</p>

        <form id="registerForm">

            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="field">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create your password"
                >

                <div class="strength-bar">
                    <div id="strengthProgress" class="strength-progress"></div>
                </div>

                <div id="passwordMessage" class="password-message"></div>
            </div>

            <div class="field">
                <label for="confirmPassword">C-Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

                <div id="confirmMessage" class="password-message"></div>
            </div>

            <button type="submit">Create Account</button>

            <div id="successMessage"></div>

        </form>
    </div>
</body>
<script src="app.js"></script>
</html>
